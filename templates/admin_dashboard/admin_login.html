{% extends 'base.html' %}
{% block title %}Admin Login - EcommerceKIM{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Staff Portal Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Staff Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Access Dashboard</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'store:product_list' %}" class="text-decoration-none small">Return to Storefront</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
