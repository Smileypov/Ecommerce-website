{% extends 'base.html' %}
{% block title %}Register - EcommerceKIM{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Create an Account</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form %}
                            <div class="col-12 mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Register</button>
                </form>
                <div class="text-center mt-3">
                    <p class="small mb-0">Already have an account? <a href="{% url 'accounts:login' %}" class="text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    input { display: block; width: 100%; padding: .375rem .75rem; font-size: 1rem; line-height: 1.5; color: #212529; background-color: #fff; background-clip: padding-box; border: 1px solid #ced4da; border-radius: .25rem; transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out; }
</style>
{% endblock %}
