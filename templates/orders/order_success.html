{% extends 'base.html' %}
{% block title %}Order Confirmed - EcommerceKIM{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="mb-4">
            <img src="https://cdn-icons-png.flaticon.com/512/148/148400.png" alt="Success" style="width: 100px;">
        </div>
        <h1 class="display-4 text-success">Thank You!</h1>
        <p class="lead">Your order has been placed successfully.</p>
        <div class="card shadow-sm my-4">
            <div class="card-body">
                <p class="mb-1 text-muted">Order ID</p>
                <h3 class="fw-bold">#{{ order.id }}</h3>
                <hr>
                <p>A confirmation email has been sent to <strong>{{ order.email }}</strong>.</p>
            </div>
        </div>
        <a href="{% url 'store:product_list' %}" class="btn btn-primary btn-lg">Continue Shopping</a>
    </div>
</div>
{% endblock %}
